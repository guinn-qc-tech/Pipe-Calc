<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cage Expert - Arbiter Engine</title>
    <style>
        :root {
            --bg-base: #030712;
            --bg-card: #111827;
            --bg-input: #1f2937;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #374151;
            --accent-blue: #2563eb;
            --accent-blue-hover: #1d4ed8;
            --pass-color: #10b981;
            --fail-color: #ef4444;
            --warn-color: #eab308;
            --weight-color: #38bdf8;
        }
        
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            background-color: var(--bg-base); 
            color: var(--text-main); 
            padding: 15px; 
            margin: 0;
            display: flex;
            justify-content: center;
            overflow-x: hidden;
        }

        .container { max-width: 900px; width: 100%; padding-bottom: 80px; }

        /* Language Toggle */
        .lang-container { display: flex; justify-content: flex-end; margin-bottom: 15px; }
        .lang-toggle { display: flex; background: var(--bg-card); border-radius: 8px; overflow: hidden; border: 1px solid var(--border-color); }
        .lang-btn { background: transparent; color: var(--text-muted); border: none; padding: 8px 16px; font-weight: 900; cursor: pointer; transition: 0.2s; font-size: 14px; }
        .lang-btn.active { background: var(--accent-blue); color: white; }

        /* Main View Tabs */
        .main-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .main-tabs .toggle-btn { flex: 1; padding: 15px; font-size: 14px; }

        /* Typography & Headers */
        h2 { font-size: 14px; text-transform: uppercase; color: var(--text-muted); letter-spacing: 1px; margin-bottom: 10px; }
        select {
            width: 100%; padding: 12px; background: var(--bg-card); color: white;
            border: 1px solid var(--border-color); border-radius: 8px; font-weight: bold;
            text-transform: uppercase; margin-bottom: 15px; font-size: 14px; outline: none; cursor: pointer;
        }

        /* Buttons & Toggles */
        .btn-group { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; }
        .btn-group::-webkit-scrollbar { display: none; }
        
        .toggle-btn {
            background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-muted);
            padding: 12px 20px; border-radius: 10px; font-weight: 900; font-size: 16px; cursor: pointer;
            transition: 0.2s; min-width: 60px; text-align: center;
        }
        .toggle-btn.active {
            background: var(--accent-blue); color: white; border-color: var(--accent-blue);
            box-shadow: 0 0 15px rgba(37,99,235,0.4); transform: scale(1.05);
        }
        .toggle-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; box-shadow: none; }

        .split-group { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 20px; }
        .split-container { display: flex; background: var(--bg-card); padding: 4px; border-radius: 12px; border: 1px solid var(--border-color); }
        .split-container .toggle-btn { flex: 1; border: none; background: transparent; padding: 10px; font-size: 14px; box-shadow: none; transform: none; }
        .split-container .toggle-btn.active { background: #374151; color: white; border-radius: 8px; }

        /* 3-Way Cage Target Toggle */
        .cage-target-container { margin-bottom: 20px; display: flex; background: var(--bg-input); border-radius: 12px; padding: 4px; border: 1px solid var(--border-color); }
        .cage-target-container .toggle-btn { flex: 1; padding: 15px; font-size: 14px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; border: none; background: transparent; transition: 0.2s; }
        .cage-target-container .toggle-btn.active { background: var(--accent-blue); color: white; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }

        /* Input Grid */
        .bento-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 25px; }
        @media (min-width: 600px) { .bento-grid { grid-template-columns: repeat(4, 1fr); } }
        
        .input-card { background: var(--bg-card); padding: 15px; border-radius: 16px; border: 1px solid var(--border-color); cursor: pointer; transition: 0.2s; }
        .input-card label { display: block; font-size: 11px; font-weight: bold; color: var(--text-muted); text-transform: uppercase; margin-bottom: 5px; pointer-events: none; }
        .input-card input {
            width: 80%; background: var(--bg-input); border: 1px solid var(--border-color); color: white;
            padding: 10px; border-radius: 6px; font-family: monospace; font-size: 16px; outline: none; cursor: pointer; pointer-events: none;
        }
        
        /* Active Input Styling */
        .input-card.active-card {
            border-color: var(--accent-blue);
            background: rgba(37, 99, 235, 0.1);
            box-shadow: 0 0 10px rgba(37,99,235,0.3);
        }
        .input-card.active-card input { border-color: var(--accent-blue); }

        /* Execute Button */
        .execute-btn {
            width: 100%; padding: 20px; background: var(--accent-blue); color: white; border: none;
            border-radius: 16px; font-size: 20px; font-weight: 900; text-transform: uppercase;
            letter-spacing: 2px; cursor: pointer; box-shadow: 0 0 20px rgba(29,78,216,0.3);
            margin-bottom: 20px; transition: 0.1s;
        }
        .execute-btn:active { transform: scale(0.98); }

        /* Results Output */
        #results-container { display: none; padding: 20px; border-radius: 16px; border: 4px solid; margin-bottom: 30px; }
        #results-title { text-align: center; font-size: 26px; font-weight: 900; text-transform: uppercase; margin: 0 0 15px 0; }
        
        .weight-banner { background: rgba(56, 189, 248, 0.1); border: 1px solid var(--weight-color); padding: 15px; border-radius: 12px; text-align: center; margin-bottom: 20px; }
        .weight-banner span { display: block; font-size: 12px; font-weight: bold; color: var(--weight-color); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
        .weight-banner div { font-size: 28px; font-weight: 900; color: white; font-family: monospace; }

        .check-item { background: var(--bg-base); padding: 15px; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 10px; display: flex; flex-direction: column; }
        .check-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .check-law { font-weight: bold; font-size: 13px; text-transform: uppercase; color: #d1d5db; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 900; }
        
        .badge-pass { background: rgba(16, 185, 129, 0.2); color: var(--pass-color); }
        .badge-fail { background: rgba(239, 68, 68, 0.2); color: var(--fail-color); }
        .badge-warn { background: rgba(234, 179, 8, 0.2); color: var(--warn-color); }
        
        .check-detail { font-family: monospace; font-size: 12px; color: var(--text-muted); }

        /* Action Buttons */
        .action-group { display: flex; gap: 10px; margin-top: 15px; }
        .export-btn, .save-btn {
            flex: 1; padding: 15px; color: white; border: 1px solid var(--border-color);
            border-radius: 12px; font-size: 14px; font-weight: bold; text-transform: uppercase; cursor: pointer;
            transition: 0.2s;
        }
        .export-btn { background: var(--bg-input); }
        .save-btn { background: #059669; border-color: #047857; }
        .export-btn:active, .save-btn:active { transform: scale(0.98); }

        /* Daily QC Report Section */
        #report-section { background: var(--bg-card); padding: 20px; border-radius: 16px; border: 1px solid var(--border-color); margin-bottom: 30px; }
        .report-header { font-size: 18px; font-weight: 900; text-transform: uppercase; margin: 0 0 15px 0; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        .report-list { list-style: none; padding: 0; margin: 0 0 15px 0; max-height: 250px; overflow-y: auto; }
        .report-item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #374151; font-family: monospace; font-size: 13px; }
        .report-item:last-child { border-bottom: none; }
        .report-item.pass { color: var(--pass-color); }
        .report-item.fail { color: var(--fail-color); }
        .report-empty { text-align: center; color: var(--text-muted); font-style: italic; padding: 10px; }
        
        .report-actions { display: flex; gap: 10px; }
        .share-btn { flex: 2; padding: 12px; background: var(--accent-blue); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .clear-btn { flex: 1; padding: 12px; background: #991b1b; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase; }

        /* Production Tab Styling */
        #prod-view { display: none; }
        .prod-card { background: var(--bg-card); padding: 15px; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 15px; }
        .prod-card-title { font-size: 16px; font-weight: 900; color: white; margin-bottom: 10px; border-bottom: 1px solid #374151; padding-bottom: 8px; }
        .prod-controls { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; }
        .prod-counter { display: flex; align-items: center; gap: 10px; }
        .prod-btn { background: var(--bg-input); border: 1px solid var(--border-color); color: white; border-radius: 6px; width: 35px; height: 35px; font-size: 18px; font-weight: bold; cursor: pointer; }
        .prod-btn:active { background: #4b5563; }
        .prod-val { font-size: 22px; font-family: monospace; font-weight: 900; min-width: 40px; text-align: center; }
        .cull-section { background: var(--bg-base); padding: 12px; border-radius: 8px; border: 1px solid #374151; }
        .cull-controls { display: flex; gap: 10px; margin-bottom: 10px; }
        .cull-select { flex: 1; padding: 8px; background: var(--bg-input); color: white; border: 1px solid var(--border-color); border-radius: 6px; font-weight: bold; outline: none; }
        .cull-add-btn { background: var(--fail-color); color: white; border: none; border-radius: 6px; padding: 0 15px; font-weight: 900; cursor: pointer; }
        .cull-add-btn:active { opacity: 0.8; }
        .cull-list { display: flex; gap: 5px; flex-wrap: wrap; min-height: 24px; }
        .cull-badge { background: rgba(239, 68, 68, 0.2); color: var(--fail-color); padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 900; display: flex; align-items: center; gap: 5px; cursor: pointer; border: 1px solid var(--fail-color); }

        /* Spec Modal & Liability Modal */
        #spec-modal, #liability-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); padding: 20px; align-items: center; justify-content: center; z-index: 50; }
        #liability-modal { z-index: 1000; backdrop-filter: blur(5px); }
        .modal-content { background: var(--bg-card); border: 2px solid var(--accent-blue); padding: 25px; border-radius: 16px; max-width: 500px; width: 100%; }
        .modal-title { font-size: 22px; font-weight: 900; margin: 0 0 10px 0; text-transform: uppercase; }
        .modal-desc { background: var(--bg-base); padding: 15px; border-radius: 10px; border: 1px solid var(--border-color); color: #d1d5db; line-height: 1.5; }
        .close-btn { width: 100%; padding: 15px; background: var(--bg-input); border: 1px solid var(--border-color); color: white; font-weight: bold; margin-top: 20px; border-radius: 10px; cursor: pointer; }

        /* Custom Centered Modal Keyboard */
        #keyboard-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); 
            z-index: 999; backdrop-filter: blur(4px); justify-content: center; align-items: center;
        }
        #keyboard-overlay.visible { display: flex; }
        
        #custom-keyboard {
            background: var(--bg-card); border: 2px solid var(--accent-blue);
            padding: 20px; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; width: 95%; max-width: 450px;
        }
        
        /* Keyboard HUD Display */
        #keyboard-display-container {
            grid-column: span 4; background: #030712; border: 1px solid #4b5563; 
            border-radius: 8px; padding: 15px; display: flex; flex-direction: column; 
            align-items: flex-end; justify-content: center; margin-bottom: 10px;
        }
        #keyboard-display-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; font-weight: bold; width: 100%; text-align: left; }
        #keyboard-display { font-size: 32px; color: white; font-family: monospace; font-weight: 900; min-height: 38px; }

        .key-btn {
            background: var(--bg-input); color: white;
            border: 1px solid var(--border-color); border-radius: 10px;
            padding: 20px 0; font-size: 26px; font-weight: 900; font-family: monospace;
            cursor: pointer; transition: background 0.1s;
        }
        .key-btn:active { background: #4b5563; }
        .key-action { color: var(--warn-color); font-size: 20px; }
        .key-done { 
            grid-column: span 4; background: var(--accent-blue); color: white; 
            border-color: var(--accent-blue); font-size: 22px; letter-spacing: 2px; padding: 15px 0; margin-top: 5px;
        }
        .key-done:active { background: var(--accent-blue-hover); }

        /* Snail Mascot Animation */
        #snail-mascot {
            position: fixed;
            bottom: 10px;
            left: -50px;
            font-size: 24px;
            z-index: 100;
            pointer-events: none;
            animation: snailCrawl 45s linear infinite;
        }
        @keyframes snailCrawl {
            0% { transform: translateX(-50px); }
            100% { transform: translateX(calc(100vw + 50px)); }
        }
    </style>
</head>
<body>

<!-- The Snail Mascot -->
<div id="snail-mascot">🐌</div>

<!-- Liability Modal -->
<div id="liability-modal">
    <div class="modal-content">
        <h3 class="modal-title" id="liab-title"></h3>
        <div class="modal-desc" id="liab-desc" style="font-size: 13px; text-align: justify; line-height: 1.6;"></div>
        <button class="execute-btn" id="liab-accept-btn" style="margin-top: 20px;" onclick="acceptLiability()"></button>
    </div>
</div>

<div class="container">
    
    <!-- Language Toggle -->
    <div class="lang-container">
        <div class="lang-toggle">
            <button id="lang-en" class="lang-btn active" onclick="setLanguage('en')">EN</button>
            <button id="lang-es" class="lang-btn" onclick="setLanguage('es')">ES</button>
        </div>
    </div>

    <!-- Main Navigation Tabs -->
    <div class="main-tabs">
        <button id="tab-btn-qc" class="toggle-btn active" onclick="switchTab('qc')">QC ARBITER</button>
        <button id="tab-btn-prod" class="toggle-btn" onclick="switchTab('prod')">PRODUCTION</button>
    </div>

    <!-- QC ARBITER VIEW -->
    <div id="qc-view">
        <!-- Specs Dropdown -->
        <select id="spec-select" onchange="showSpecModal()">
            <option value="" selected disabled id="ui-spec-select">📖 VIEW ASTM C76 CAGE SPECS</option>
            <option value="c76_steel" id="ui-opt-steel">ASTM C76 - Area Steel (As)</option>
            <option value="c76_cover" id="ui-opt-cover">ASTM C76 - Clear Cover</option>
            <option value="c76_long" id="ui-opt-long">Plant Standard - Longitudinal</option>
            <option value="joint_geo" id="ui-opt-joint">Joint Geometry - Bell/Spigot</option>
        </select>

        <!-- Size Toggles -->
        <div class="btn-group" id="size-toggles">
            <!-- Generated by JS -->
        </div>

        <!-- Wall & Class Toggles -->
        <div class="split-group" style="grid-template-columns: 1fr;">
            <div class="split-container" id="wall-toggles">
                <button class="toggle-btn" onclick="selectWall('A')" id="ui-wall-a">Wall A</button>
                <button class="toggle-btn active" onclick="selectWall('B')" id="ui-wall-b">Wall B</button>
                <button class="toggle-btn" onclick="selectWall('C')" id="ui-wall-c">Wall C</button>
            </div>
            <div class="split-container" id="class-toggles">
                <button class="toggle-btn" onclick="selectClass('I')" id="ui-class-1">Class I</button>
                <button class="toggle-btn" onclick="selectClass('II')" id="ui-class-2">Class II</button>
                <button class="toggle-btn active" onclick="selectClass('III')" id="ui-class-3">Class III</button>
                <button class="toggle-btn" onclick="selectClass('IV')" id="ui-class-4">Class IV</button>
                <button class="toggle-btn" onclick="selectClass('V')" id="ui-class-5">Class V</button>
            </div>
        </div>

        <!-- 3-Way Cage Target Toggle -->
        <div class="cage-target-container" id="cage-toggles">
            <button class="toggle-btn active" id="btn-single" onclick="selectCage('s')">SINGLE CAGE</button>
            <button class="toggle-btn" id="btn-inner" onclick="selectCage('i')">INNER CAGE</button>
            <button class="toggle-btn" id="btn-outer" onclick="selectCage('o')">OUTER CAGE</button>
        </div>

        <!-- Fractional Inputs -->
        <h2 id="ui-measurements-title">Fractional Measurements</h2>
        <div class="bento-grid">
            <div class="input-card" id="card-wireDia" onclick="activateKeyboard('wireDia', 'lbl-wire')">
                <label id="lbl-wire">Wire Dia (e.g. 3/8)</label>
                <input type="text" id="wireDia" placeholder="0.0" readonly>
            </div>
            <div class="input-card" id="card-pitch" onclick="activateKeyboard('pitch', 'lbl-pitch')">
                <label id="lbl-pitch">Pitch (e.g. 2 1/2)</label>
                <input type="text" id="pitch" placeholder="0.0" readonly>
            </div>
            <div class="input-card" id="card-cageOD" onclick="activateKeyboard('cageOD', 'lbl-od')">
                <label id="lbl-od">Cage OD (Inches)</label>
                <input type="text" id="cageOD" placeholder="0.0" readonly>
            </div>
            <div class="input-card" id="card-cageLength" onclick="activateKeyboard('cageLength', 'lbl-height')">
                <label id="lbl-height">Cage Height (Inches)</label>
                <input type="text" id="cageLength" placeholder="e.g. 96" readonly>
            </div>
            <div class="input-card" id="card-vertDia" onclick="activateKeyboard('vertDia', 'lbl-vdia')">
                <label id="lbl-vdia">Vert Dia</label>
                <input type="text" id="vertDia" placeholder="0.0" readonly>
            </div>
            <div class="input-card" id="card-vertCount" onclick="activateKeyboard('vertCount', 'lbl-vcount')">
                <label id="lbl-vcount">Vert Count</label>
                <input type="text" id="vertCount" placeholder="0" readonly>
            </div>
            <div class="input-card" id="card-bellOD" onclick="activateKeyboard('bellOD', 'lbl-bellod')">
                <label id="lbl-bellod">Bell OD</label>
                <input type="text" id="bellOD" placeholder="" readonly>
            </div>
            <div class="input-card" id="card-bellLength" onclick="activateKeyboard('bellLength', 'lbl-bellht')">
                <label id="lbl-bellht">Bell Ht</label>
                <input type="text" id="bellLength" placeholder="" readonly>
            </div>
        </div>

        <!-- Execute -->
        <button class="execute-btn" id="ui-run-btn" onclick="runArbiterValidation()">Run Arbiter Validation</button>

        <!-- Results -->
        <div id="results-container">
            <h3 id="results-title"></h3>
            <div id="results-log"></div>
            <div class="action-group">
                <button class="export-btn" id="ui-export-btn" onclick="downloadQCSpreadsheet()">💾 DOWNLOAD SPREADSHEET</button>
                <button class="save-btn" id="ui-save-btn" onclick="saveCurrentCheck()">💾 SAVE CHECK</button>
            </div>
        </div>

        <!-- Daily QC Report Section -->
        <div id="report-section">
            <h3 class="report-header" id="ui-report-title">Daily Validation Report</h3>
            <ul class="report-list" id="report-list">
                <!-- Populated by JS -->
            </ul>
            <div class="report-actions">
                <button class="share-btn" id="ui-share-btn" onclick="shareDailyReport()">📤 SHARE DAILY REPORT</button>
                <button class="clear-btn" id="ui-clear-btn" onclick="clearDailyReport()">🗑️ CLEAR</button>
            </div>
        </div>
    </div>

    <!-- PRODUCTION VIEW -->
    <div id="prod-view">
        <h2 id="ui-prod-title">Daily Production & Culls</h2>
        <div id="prod-list-container">
            <!-- Populated by JS -->
        </div>
        <button class="export-btn" id="ui-prod-export-btn" onclick="downloadProdSpreadsheet()" style="margin-top: 20px; width: 100%;">💾 DOWNLOAD PROD SPREADSHEET</button>
    </div>

</div>

<!-- Spec Modal -->
<div id="spec-modal">
    <div class="modal-content">
        <h3 class="modal-title" id="modal-title"></h3>
        <div class="modal-desc" id="modal-desc"></div>
        <button class="close-btn" id="ui-close-btn" onclick="closeSpecModal()">CLOSE</button>
    </div>
</div>

<!-- Custom Centered Keyboard Overlay -->
<div id="keyboard-overlay">
    <div id="custom-keyboard">
        
        <!-- Interactive HUD Display -->
        <div id="keyboard-display-container">
            <span id="keyboard-display-label">Active Input</span>
            <div id="keyboard-display"></div>
        </div>

        <button class="key-btn" onclick="handleKey('1')">1</button>
        <button class="key-btn" onclick="handleKey('2')">2</button>
        <button class="key-btn" onclick="handleKey('3')">3</button>
        <button class="key-btn key-action" id="kb-del" onclick="handleBackspace()">⌫</button>

        <button class="key-btn" onclick="handleKey('4')">4</button>
        <button class="key-btn" onclick="handleKey('5')">5</button>
        <button class="key-btn" onclick="handleKey('6')">6</button>
        <button class="key-btn key-action" id="kb-clr" onclick="handleClear()">CLR</button>

        <button class="key-btn" onclick="handleKey('7')">7</button>
        <button class="key-btn" onclick="handleKey('8')">8</button>
        <button class="key-btn" onclick="handleKey('9')">9</button>
        <button class="key-btn key-action" id="kb-spc" style="font-size: 16px; font-weight: 900;" onclick="handleKey(' ')">SPC</button> 

        <button class="key-btn" onclick="handleKey('.')">.</button>
        <button class="key-btn" onclick="handleKey('0')">0</button>
        <button class="key-btn" onclick="handleKey('/')">/</button>
        <button class="key-btn key-done" id="kb-done" onclick="hideKeyboard()">DONE</button>
    </div>
</div>

<script>
    // ==========================================
    // MULTI-DIMENSIONAL C76 DATA CONFIGURATION
    // ==========================================
    const PIPE_SIZES = [15, 18, 24, 30, 36, 42, 48, 54, 60, 72];
    
    // As = { s: single cage, i: inner cage, o: outer cage }. 'null' means ASTM spec doesn't allow it.
    // 30" Class V updated with plant standard 0.24 for outer cage.
    const ASTM_C76 = {
        15: {
            min_vertical: 12,

    // ==========================================
    // TABS MANAGEMENT
    // ==========================================
    function switchTab(tabId) {
        if (tabId === 'qc') {
            document.getElementById('qc-view').style.display = 'block';
            document.getElementById('prod-view').style.display = 'none';
            document.getElementById('tab-btn-qc').className = 'toggle-btn active';
            document.getElementById('tab-btn-prod').className = 'toggle-btn';
        } else {
            document.getElementById('qc-view').style.display = 'none';
            document.getElementById('prod-view').style.display = 'block';
            document.getElementById('tab-btn-qc').className = 'toggle-btn';
            document.getElementById('tab-btn-prod').className = 'toggle-btn active';
            syncProductionWithChecks();
            renderProduction();
        }
    }

    function checkLiability() {
        if (!localStorage.getItem('arbiter_liability_accepted')) {
            document.getElementById('liability-modal').style.display = 'flex';
        }
    }

    function acceptLiability() {
        localStorage.setItem('arbiter_liability_accepted', 'true');
        document.getElementById('liability-modal').style.display = 'none';
    }

    function getDailyChecks() {

        localStorage.setItem('arbiter_daily_checks', JSON.stringify(checks));

        const checks = getDailyChecks();
        const listContainer = document.getElementById('report-list');
        const d = langDict[currentLang];
        listContainer.innerHTML = '';

        if (checks.length === 0) {
            listContainer.innerHTML = `<li class="report-empty">${d.txtEmpty}</li>`;
            return;
        }

        checks.forEach(check => {
            const li = document.createElement('li');
            li.className = `report-item ${check.status === 'PASS' ? 'pass' : 'fail'}`;
            li.innerHTML = `<span>[${check.time}] ${check.size}" W-${check.wall} CL-${check.cls} (${check.cage})</span> <span>${check.status}</span>`;
            listContainer.appendChild(li);
        });
    }

    function saveCurrentCheck() {
        if (!currentValidationRecord) return;
        
        const checks = getDailyChecks();
        checks.push(currentValidationRecord);
        saveDailyChecks(checks);
        
        // Also auto-sync to production
        syncProductionWithChecks();
        
        const btn = document.getElementById('ui-save-btn');
        const originalText = langDict[currentLang].btnSaveCheck;
        btn.innerText = langDict[currentLang].btnSaveCheckDone;
        
        renderDailyReport();

        setTimeout(() => {
            btn.innerText = originalText;
        }, 2000);
    }

    function clearDailyReport() {
        if (confirm("Are you sure you want to clear today's QC & Production report?")) {
            localStorage.removeItem('arbiter_daily_checks');
            localStorage.removeItem('arbiter_production_data');
            renderDailyReport();
            if (document.getElementById('prod-view').style.display === 'block') {
                renderProduction();
            }
        }
    }

    function shareDailyReport() {
        const checks = getDailyChecks();
        const d = langDict[currentLang];
        
        if (checks.length === 0) {
            alert(d.txtEmpty);
            return;
        }

        const dateStr = new Date().toLocaleDateString();
        let reportText = `${d.reportTitle} - ${dateStr}\n\n`;
        
        checks.forEach((check, index) => {
            reportText += `${index + 1}. [${check.time}] ${check.size}" Wall-${check.wall} Class-${check.cls} (${check.cage}) | Status: ${check.status}\n`;
        });
        
        reportText += "\n--\nGenerated by Arbiter Engine";

        if (navigator.share) {
            navigator.share({
                title: `${d.reportTitle} - ${dateStr}`,
                text: reportText,
            }).catch(err => {
                console.log("Error sharing:", err);
            });
        } else {
            // Fallback for desktop or non-supported browsers
            navigator.clipboard.writeText(reportText).then(() => {
                alert(d.exportCopied + " (Share API not supported on this device, copied to clipboard instead)");
            });
        }
    }

    // ==========================================
    // PRODUCTION & CULL LOGIC
    // ==========================================
    function syncProductionWithChecks() {
        const checks = getDailyChecks();
        let prodData = JSON.parse(localStorage.getItem('arbiter_production_data')) || {};
        
        checks.forEach(chk => {
            // Generate a unique signature for the cage type
            const sig = `${chk.size}-${chk.wall}-${chk.cls}-${chk.cage}`;
            if (!prodData[sig]) {
                prodData[sig] = {
                    size: chk.size, 
                    wall: chk.wall, 
                    cls: chk.cls, 
                    cage: chk.cage,
                    made: 0, 
                    culls: [] // Array of integers (percentages)
                };
            }
        });
        localStorage.setItem('arbiter_production_data', JSON.stringify(prodData));
    }

    function renderProduction() {
        const listContainer = document.getElementById('prod-list-container');
        let prodData = JSON.parse(localStorage.getItem('arbiter_production_data')) || {};
        const keys = Object.keys(prodData);
        const d = langDict[currentLang];

        if (keys.length === 0) {
            listContainer.innerHTML = `<div class="report-empty">${d.txtEmpty}</div>`;
            return;
        }

        let html = '';
        keys.forEach(k => {
            let p = prodData[k];
            
            let cullBadges = '';
            p.culls.forEach((cval, idx) => {
                cullBadges += `<span class="cull-badge" onclick="removeCull('${k}', ${idx})">${cval}% &times;</span>`;
            });

            html += `
                <div class="prod-card">
                    <div class="prod-card-title">${p.size}" Wall ${p.wall} Class ${p.cls} (${p.cage})</div>
                    <div class="prod-controls">
                        <span style="font-size: 14px; font-weight: bold; color: var(--text-muted); text-transform: uppercase;">${d.prodMade}</span>
                        <div class="prod-counter">
                            <button class="prod-btn" onclick="updateMade('${k}', -1)">-</button>
                            <span class="prod-val">${p.made}</span>
                            <button class="prod-btn" onclick="updateMade('${k}', 1)">+</button>
                        </div>
                    </div>
                    <div class="cull-section">
                        <div class="cull-controls">
                            <select id="cull-sel-${k}" class="cull-select">
                                <option value="25">${d.cull25}</option>
                                <option value="50">${d.cull50}</option>
                                <option value="75">${d.cull75}</option>
                                <option value="100">${d.cull100}</option>
                            </select>
                            <button class="cull-add-btn" onclick="addCull('${k}')">${d.prodCullBtn}</button>
                        </div>
                        <div class="cull-list">${cullBadges}</div>
                    </div>
                </div>
            `;
        });
        listContainer.innerHTML = html;
    }

    function updateMade(sig, amount) {
        let prodData = JSON.parse(localStorage.getItem('arbiter_production_data')) || {};
        if (prodData[sig]) {
            prodData[sig].made += amount;
            if (prodData[sig].made < 0) prodData[sig].made = 0;
            localStorage.setItem('arbiter_production_data', JSON.stringify(prodData));
            renderProduction();
        }
    }

    function addCull(sig) {
        let prodData = JSON.parse(localStorage.getItem('arbiter_production_data')) || {};
        const sel = document.getElementById(`cull-sel-${sig}`);
        if (prodData[sig] && sel) {
            prodData[sig].culls.push(parseInt(sel.value));
            localStorage.setItem('arbiter_production_data', JSON.stringify(prodData));
            renderProduction();
        }
    }

    function removeCull(sig, index) {
        let prodData = JSON.parse(localStorage.getItem('arbiter_production_data')) || {};
        if (prodData[sig]) {
            prodData[sig].culls.splice(index, 1);
            localStorage.setItem('arbiter_production_data', JSON.stringify(prodData));
            renderProduction();
        }
    }

    // ==========================================
    // SPREADSHEET FILE GENERATION (CSV)
    // ==========================================
    function downloadQCSpreadsheet() {
        const d = langDict[currentLang];
        let cageName = activeCage === 's' ? 'Single' : (activeCage === 'i' ? 'Inner' : 'Outer');
        
        // Gather values safely
        const size = selectedSize || "0";
        const wall = selectedWall || "N/A";
        const cls = selectedClass || "N/A";
        const wDia = document.getElementById('wireDia').value || "0";
        const pitch = document.getElementById('pitch').value || "0";
        const cOD = document.getElementById('cageOD').value || "0";
        const cLen = document.getElementById('cageLength').value || "0";
        const vDia = document.getElementById('vertDia').value || "0";
        const vCount = document.getElementById('vertCount').value || "0";
        const bOD = document.getElementById('bellOD').value || "N/A";
        const bLen = document.getElementById('bellLength').value || "N/A";
        
        // Format as standard CSV (Comma Separated Values)
        const header = "Size,Wall,Class,Cage,Wire Dia,Pitch,Cage OD,Height,Vert Dia,Vert Count,Bell OD,Bell Height";
        const row = `"${size}""","${wall}","${cls}","${cageName}","${wDia}","${pitch}","${cOD}","${cLen}","${vDia}","${vCount}","${bOD}","${bLen}"`;
        const csvData = header + "\n" + row;
        
        triggerDownload(csvData, `QC_Validation_Report_${new Date().toLocaleDateString().replace(/\//g, '-')}.csv`);
    }

    function downloadProdSpreadsheet() {
        const d = langDict[currentLang];
        let prodData = JSON.parse(localStorage.getItem('arbiter_production_data')) || {};
        const keys = Object.keys(prodData);
        
        if (keys.length === 0) { 
            alert(d.txtEmpty); 
            return; 
        }
        
        let header = "Size,Wall,Class,Cage,Total Made,Total Culls (Count),Equivalent Cull Qty,Cull Breakdown";
        let rows = [];
        
        keys.forEach(k => {
            let p = prodData[k];
            let cullCount = p.culls.length;
            let equivCulls = p.culls.reduce((sum, val) => sum + (val / 100), 0);
            
            // Wrap breakdown in quotes so internal commas don't break the CSV columns
            let breakdown = p.culls.length > 0 ? `"${p.culls.map(c => c + "%").join(", ")}"` : "None";
            
            rows.push(`"${p.size}""","${p.wall}","${p.cls}","${p.cage}","${p.made}","${cullCount}","${equivCulls.toFixed(2)}",${breakdown}`);
        });
        
        const csvData = header + "\n" + rows.join("\n");
        triggerDownload(csvData, `Daily_Production_Report_${new Date().toLocaleDateString().replace(/\//g, '-')}.csv`);
    }

    // Native file download generator
    function triggerDownload(csvContent, fileName) {
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = window.URL.createObjectURL(blob);
        const link = document.createElement("a");
        
        link.setAttribute("href", url);
        link.setAttribute("download", fileName);
        link.style.visibility = 'hidden';
        
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    // ==========================================
    // INITIALIZATION & UI
    // ==========================================
    function renderSizes() {
        const container = document.getElementById('size-toggles');
        container.innerHTML = '';
        PIPE_SIZES.forEach(size => {
            const btn = document.createElement('button');
            btn.className = `toggle-btn ${size === selectedSize ? 'active' : ''}`;
            btn.innerText = `${size}"`;
            btn.onclick = () => {
                selectedSize = size;
                enforceCageLogic();
                renderSizes();
            };
            container.appendChild(btn);
        });
    }

    function selectWall(wall) {
        selectedWall = wall;
        const btns = document.getElementById('wall-toggles').children;
        for(let b of btns) {
            // Must check original english ID substring since text can change language
            if(b.id === `ui-wall-${wall.toLowerCase()}`) {
                b.className = 'toggle-btn active';
            } else {
                b.className = 'toggle-btn';
            }
        }
        enforceCageLogic();
    }

    function selectClass(cls) {
        selectedClass = cls;
        const btns = document.getElementById('class-toggles').children;
        const clsMap = {'I':'1', 'II':'2', 'III':'3', 'IV':'4', 'V':'5'};
        for(let b of btns) {
            if(b.id === `ui-class-${clsMap[cls]}`) {
                b.className = 'toggle-btn active';
            } else {
                b.className = 'toggle-btn';
            }
        }
        enforceCageLogic();
    }

    function selectCage(cageType) {
        const classData = ASTM_C76[selectedSize][selectedWall][selectedClass];
        if (!classData) return;
        
        if (cageType === 's' && classData.s === null) return;
        if ((cageType === 'i' || cageType === 'o') && classData.i === null) return;
        
        activeCage = cageType;
        updateCageToggles();
    }

    function enforceCageLogic() {
        const classData = ASTM_C76[selectedSize][selectedWall][selectedClass];
        
        // If the combo isnt in ASTM C76 at all, logic locks out the toggles.
        if (!classData) {
            updateCageToggles();
            return;
        }

        if (classData.s !== null) {
            activeCage = 's';
        } else if (classData.s === null && classData.i !== null) {
            if (activeCage === 's') activeCage = 'i';
        }
        
        updateCageToggles();
    }

    function updateCageToggles() {
        const classData = ASTM_C76[selectedSize][selectedWall][selectedClass];
        
        const btnSingle = document.getElementById('btn-single');
        const btnInner = document.getElementById('btn-inner');
        const btnOuter = document.getElementById('btn-outer');

        if (!classData) {
            btnSingle.disabled = true; btnInner.disabled = true; btnOuter.disabled = true;
            btnSingle.className = 'toggle-btn'; btnInner.className = 'toggle-btn'; btnOuter.className = 'toggle-btn';
            return;
        }

        if (classData.s !== null) {
            btnSingle.disabled = false;
            btnInner.disabled = classData.i === null;
            btnOuter.disabled = classData.o === null;
        } else {
            btnSingle.disabled = true;
            btnInner.disabled = false;
            btnOuter.disabled = false;
        }

        btnSingle.className = `toggle-btn ${activeCage === 's' ? 'active' : ''}`;
        btnInner.className = `toggle-btn ${activeCage === 'i' ? 'active' : ''}`;
        btnOuter.className = `toggle-btn ${activeCage === 'o' ? 'active' : ''}`;
    }

    function showSpecModal() {
        const select = document.getElementById('spec-select');
        const val = select.value;
        const d = langDict[currentLang];
        
        if(val) {
            document.getElementById('modal-title').innerText = d[`${val}_title`] || "";
            document.getElementById('modal-desc').innerText = d[`${val}_desc`] || "";
            document.getElementById('spec-modal').style.display = 'flex';
        }
        select.value = ""; 
    }

    function closeSpecModal() {
        document.getElementById('spec-modal').style.display = 'none';
    }

    // ==========================================
    // CUSTOM CENTERED MODAL KEYBOARD w/ HUD
    // ==========================================
    function activateKeyboard(inputId, uiLabelId) {
        if (activeInputId) {
            document.getElementById(`card-${activeInputId}`).classList.remove('active-card');
        }
        
        activeInputId = inputId;
        
        document.getElementById(`card-${inputId}`).classList.add('active-card');
        document.getElementById('keyboard-display-label').innerText = document.getElementById(uiLabelId).innerText;
        document.getElementById('keyboard-display').innerText = document.getElementById(inputId).value || "";
        document.getElementById('keyboard-overlay').classList.add('visible');
    }

    function hideKeyboard() {
        if (activeInputId) {
            document.getElementById(`card-${activeInputId}`).classList.remove('active-card');
        }
        document.getElementById('keyboard-overlay').classList.remove('visible');
        activeInputId = null;
    }

    function handleKey(val) {
        if (!activeInputId) return;
        const input = document.getElementById(activeInputId);
        input.value += val;
        document.getElementById('keyboard-display').innerText = input.value;
    }

    function handleBackspace() {
        if (!activeInputId) return;
        const input = document.getElementById(activeInputId);
        input.value = input.value.slice(0, -1);
        document.getElementById('keyboard-display').innerText = input.value;
    }

    function handleClear() {
        if (!activeInputId) return;
        document.getElementById(activeInputId).value = "";
        document.getElementById('keyboard-display').innerText = "";
    }

    // ==========================================
    // ARBITER VALIDATION ENGINE
    // ==========================================
    function runArbiterValidation() {
        hideKeyboard();
        const d = langDict[currentLang];
        
        let cageName = "";
        if(currentLang === 'en') {
            cageName = activeCage === 's' ? 'SINGLE' : (activeCage === 'i' ? 'INNER' : 'OUTER');
        } else {
            cageName = activeCage === 's' ? 'SIMPLE' : (activeCage === 'i' ? 'INTERIOR' : 'EXTERIOR');
        }
        
        console.log(`[ARBITER] Initiating validation for ${selectedSize}" Wall ${selectedWall} Class ${selectedClass} | Target: ${cageName} CAGE`);
        
        const d_wire = parseMeasurement(document.getElementById('wireDia').value);
        const s_pitch = parseMeasurement(document.getElementById('pitch').value);
        const l_cage = parseMeasurement(document.getElementById('cageLength').value);
        const d_vert = parseMeasurement(document.getElementById('vertDia').value);
        const count_vert = parseMeasurement(document.getElementById('vertCount').value);
        const od_cage = parseMeasurement(document.getElementById('cageOD').value);
        const od_bell = parseMeasurement(document.getElementById('bellOD').value);
        
        const resultsContainer = document.getElementById('results-container');
        const resultsTitle = document.getElementById('results-title');
        const resultsLog = document.getElementById('results-log');
        
        resultsLog.innerHTML = '';
        resultsContainer.style.display = 'block';

        const sizeData = ASTM_C76[selectedSize];
        const classData = sizeData[selectedWall][selectedClass];
        const min_vertical = sizeData.min_vertical;

        if (!classData) {
            resultsContainer.style.backgroundColor = 'rgba(239, 68, 68, 0.1)';
            resultsContainer.style.borderColor = '#7f1d1d';
            resultsTitle.style.color = 'var(--fail-color)';
            resultsTitle.innerText = d.errInvalidTitle;
            let msg = d.errInvalidDesc.replace('[SIZE]', selectedSize).replace('[WALL]', selectedWall).replace('[CLASS]', selectedClass);
            resultsLog.innerHTML = `<div style="color:var(--fail-color); font-family:monospace; text-align:center;">${msg}</div>`;
            return;
        }

        if (d_wire <= 0 || s_pitch <= 0 || od_cage <= 0 || l_cage <= 0) {
            resultsContainer.style.backgroundColor = 'rgba(239, 68, 68, 0.1)';
            resultsContainer.style.borderColor = '#7f1d1d';
            resultsTitle.style.color = 'var(--fail-color)';
            resultsTitle.innerText = d.errExecTitle;
            resultsLog.innerHTML = `<div style="color:var(--fail-color); font-family:monospace; text-align:center;">${d.errExecDesc}</div>`;
            return;
        }

        let passedAll = true;
        let checksHTML = '';

        const addCheck = (law, status, detail) => {
            let badgeClass = status === 'PASS' ? 'badge-pass' : status === 'FAIL' ? 'badge-fail' : 'badge-warn';
            checksHTML += `
                <div class="check-item">
                    <div class="check-header">
                        <span class="check-law">${law}</span>
                        <span class="badge ${badgeClass}">${status}</span>
                    </div>
                    <span class="check-detail">${detail}</span>
                </div>
            `;
        };

        // --- CAGE WEIGHT CALCULATOR (Volumetric Density of Steel = 0.2833 lbs/in³) ---
        const steelDensity = 0.2833; 
        const circWireArea = Math.PI * Math.pow(d_wire / 2, 2);
        const cageCircumference = Math.PI * od_cage; 
        const numberOfWraps = l_cage / s_pitch;
        const totalCircLength = cageCircumference * numberOfWraps; 
        const circWeight = totalCircLength * circWireArea * steelDensity;

        const vertWireArea = Math.PI * Math.pow(d_vert / 2, 2);
        const totalVertLength = l_cage * count_vert; 
        const vertWeight = totalVertLength * vertWireArea * steelDensity;

        const totalEstimatedWeight = circWeight + vertWeight;

        checksHTML += `
            <div class="weight-banner">
                <span>${d.weightTitle}</span>
                <div>${totalEstimatedWeight.toFixed(1)} LBS</div>
            </div>
        `;

        // LAW 1: Area of Steel
        const areaSingle = (Math.PI * Math.pow(d_wire, 2)) / 4;
        const actual_As = areaSingle * (12 / s_pitch);
        
        const target_As = classData[activeCage];
        if (!target_As) {
            let msg = d.errCageDesc.replace('[CAGE]', cageName).replace('[SIZE]', selectedSize).replace('[WALL]', selectedWall).replace('[CLASS]', selectedClass);
            resultsLog.innerHTML = `<div style="color:var(--fail-color);">${msg}</div>`;
            return;
        }

        const asPassed = actual_As >= target_As;
        if (!asPassed) passedAll = false;
        
        let asTitle = d.chkAsTitle.replace('[CAGE]', cageName);
        let asDetail = d.chkAsCalc.replace('[ACTUAL]', actual_As.toFixed(4)).replace('[TARGET]', target_As.toFixed(4));
        addCheck(asTitle, asPassed ? 'PASS' : 'FAIL', asDetail);

        // LAW 2: Clear Cover
        const pipe_OD = selectedSize + (sizeData[selectedWall].thk * 2);
        let clear_cover = 0;
        let cover_location = "";
        let optimal_text = "~1.00\"";
        let target_min = 0.75;
        let target_max = 1.5;

        if (activeCage === 'o') {
            clear_cover = (pipe_OD - od_cage) / 2;
            cover_location = d.locOut;
        } else if (activeCage === 'i') {
            const id_cage = od_cage - (2 * d_wire);
            clear_cover = (id_cage - selectedSize) / 2;
            cover_location = d.locIn;
        } else if (activeCage === 's') {
            // Single Cage: Measured from inside surface (ASTM C76 8.1.1)
            const id_cage = od_cage - (2 * d_wire);
            clear_cover = (id_cage - selectedSize) / 2;
            cover_location = d.locIn;
            
            const wall_thk = sizeData[selectedWall].thk;
            if (wall_thk < 2.5) {
                target_min = 0.75; // 3/4 inch minimum for thin walls
                optimal_text = ">= 0.75\"";
            } else {
                target_min = wall_thk * 0.35;
                target_max = wall_thk * 0.50;
                optimal_text = `${target_min.toFixed(2)}" - ${target_max.toFixed(2)}" (35%-50%)`;
            }
        }

        const coverPassed = clear_cover >= target_min && clear_cover <= target_max;
        if (!coverPassed) passedAll = false;
        
        let coverDetail = d.chkCoverCalc.replace('[COVER]', clear_cover.toFixed(3)).replace('[LOC]', cover_location).replace('[OPT]', optimal_text);
        addCheck(d.chkCoverTitle, coverPassed ? 'PASS' : 'FAIL', coverDetail);

        // LAW 3: Plant Specific Longitudinal count
        const vertPassed = count_vert >= min_vertical;
        if (!vertPassed) passedAll = false;
        
        let vertDetail = d.chkVertCalc.replace('[COUNT]', count_vert).replace('[MIN]', min_vertical);
        addCheck(d.chkVertTitle, vertPassed ? 'PASS' : 'FAIL', vertDetail);

        // LAW 4: ASTM A1064 Vertical Area (40% Rule)
        const areaVertSingle = (Math.PI * Math.pow(d_vert, 2)) / 4;
        const targetVertArea = areaSingle * 0.40;
        const vertAreaPassed = areaVertSingle >= targetVertArea;
        if (!vertAreaPassed) passedAll = false;
        
        let vertAreaDetail = d.chkVertAreaCalc.replace('[ACTUAL]', areaVertSingle.toFixed(4)).replace('[TARGET]', targetVertArea.toFixed(4));
        addCheck(d.chkVertAreaTitle, vertAreaPassed ? 'PASS' : 'FAIL', vertAreaDetail);

        // LAW 5: Bell Geometry
        if (od_bell > 0) {
            const bellClearance = od_bell - od_cage;
            const bellPassed = bellClearance > 1.5; 
            if (!bellPassed) passedAll = false;
            
            let bellDetail = d.chkBellPass.replace('[EXT]', bellClearance.toFixed(2));
            addCheck(d.chkBellTitle, bellPassed ? 'PASS' : 'FAIL', bellDetail);
        } else {
            addCheck(d.chkBellTitle, 'WARN', d.chkBellWarn);
        }

        // Output Result UI
        if (passedAll) {
            resultsContainer.style.backgroundColor = 'rgba(16, 185, 129, 0.1)';
            resultsContainer.style.borderColor = '#064e3b';
            resultsTitle.style.color = 'var(--pass-color)';
            resultsTitle.innerText = d.approvedTitle.replace('[CAGE]', cageName);
        } else {
            resultsContainer.style.backgroundColor = 'rgba(239, 68, 68, 0.1)';
            resultsContainer.style.borderColor = '#7f1d1d';
            resultsTitle.style.color = 'var(--fail-color)';
            resultsTitle.innerText = d.failedTitle.replace('[CAGE]', cageName);
        }
        
        resultsLog.innerHTML = checksHTML;

        // Save Current Run State for Reporting
        const now = new Date();
        currentValidationRecord = {
            time: now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
            size: selectedSize,
            wall: selectedWall,
            cls: selectedClass,
            cage: cageName,
            status: passedAll ? 'PASS' : 'FAIL'
        };

        // Reset Save button UI if they run a new validation
        document.getElementById('ui-save-btn').innerText = d.btnSaveCheck;

        console.log(`[ARBITER] Execution complete. Status: ${passedAll ? 'PASSED' : 'FAILED'}`);
    }

    // Boot up
    setLanguage('en');
    renderSizes();
    enforceCageLogic();
    checkLiability();
</script>
