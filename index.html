<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cage Expert - Arbiter Engine</title>
    <style>
        :root {
            --bg-base: #030712;
            --bg-card: #111827;
            --bg-input: #1f2937;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #374151;
            --accent-blue: #2563eb;
            --accent-blue-hover: #1d4ed8;
            --pass-color: #10b981;
            --fail-color: #ef4444;
            --warn-color: #eab308;
            --weight-color: #38bdf8;
        }
        
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            background-color: var(--bg-base); 
            color: var(--text-main); 
            padding: 15px; 
            margin: 0;
            display: flex;
            justify-content: center;
        }

        .container { max-width: 900px; width: 100%; padding-bottom: 50px; }

        /* Typography & Headers */
        h2 { font-size: 14px; text-transform: uppercase; color: var(--text-muted); letter-spacing: 1px; margin-bottom: 10px; }
        select {
            width: 100%; padding: 12px; background: var(--bg-card); color: white;
            border: 1px solid var(--border-color); border-radius: 8px; font-weight: bold;
            text-transform: uppercase; margin-bottom: 15px; font-size: 14px; outline: none;
        }

        /* Buttons & Toggles */
        .btn-group { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; }
        .btn-group::-webkit-scrollbar { display: none; }
        
        .toggle-btn {
            background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-muted);
            padding: 12px 20px; border-radius: 10px; font-weight: 900; font-size: 16px; cursor: pointer;
            transition: 0.2s; min-width: 60px; text-align: center;
        }
        .toggle-btn.active {
            background: var(--accent-blue); color: white; border-color: var(--accent-blue);
            box-shadow: 0 0 15px rgba(37,99,235,0.4); transform: scale(1.05);
        }
        .toggle-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; box-shadow: none; }

        .split-group { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 20px; }
        .split-container { display: flex; background: var(--bg-card); padding: 4px; border-radius: 12px; border: 1px solid var(--border-color); }
        .split-container .toggle-btn { flex: 1; border: none; background: transparent; padding: 10px; font-size: 14px; box-shadow: none; transform: none; }
        .split-container .toggle-btn.active { background: #374151; color: white; border-radius: 8px; }

        /* 3-Way Cage Target Toggle */
        .cage-target-container { margin-bottom: 20px; display: flex; background: var(--bg-input); border-radius: 12px; padding: 4px; border: 1px solid var(--border-color); }
        .cage-target-container .toggle-btn { flex: 1; padding: 15px; font-size: 16px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; border: none; background: transparent; transition: 0.2s; }
        .cage-target-container .toggle-btn.active { background: var(--accent-blue); color: white; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }

        /* Input Grid */
        .bento-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 25px; }
        @media (min-width: 600px) { .bento-grid { grid-template-columns: repeat(3, 1fr); } }
        
        .input-card { background: var(--bg-card); padding: 15px; border-radius: 16px; border: 1px solid var(--border-color); cursor: pointer; transition: 0.2s; }
        .input-card label { display: block; font-size: 11px; font-weight: bold; color: var(--text-muted); text-transform: uppercase; margin-bottom: 5px; pointer-events: none; }
        .input-card input {
            width: 80%; background: var(--bg-input); border: 1px solid var(--border-color); color: white;
            padding: 10px; border-radius: 6px; font-family: monospace; font-size: 16px; outline: none; cursor: pointer; pointer-events: none;
        }
        
        /* Active Input Styling */
        .input-card.active-card {
            border-color: var(--accent-blue);
            background: rgba(37, 99, 235, 0.1);
            box-shadow: 0 0 10px rgba(37,99,235,0.3);
        }
        .input-card.active-card input {
            border-color: var(--accent-blue);
        }

        /* Execute Button */
        .execute-btn {
            width: 100%; padding: 20px; background: var(--accent-blue); color: white; border: none;
            border-radius: 16px; font-size: 20px; font-weight: 900; text-transform: uppercase;
            letter-spacing: 2px; cursor: pointer; box-shadow: 0 0 20px rgba(29,78,216,0.3);
            margin-bottom: 20px; transition: 0.1s;
        }
        .execute-btn:active { transform: scale(0.98); }

        /* Results Output */
        #results-container { display: none; padding: 20px; border-radius: 16px; border: 4px solid; margin-bottom: 30px; }
        #results-title { text-align: center; font-size: 30px; font-weight: 900; text-transform: uppercase; margin: 0 0 15px 0; }
        
        .weight-banner { background: rgba(56, 189, 248, 0.1); border: 1px solid var(--weight-color); padding: 15px; border-radius: 12px; text-align: center; margin-bottom: 20px; }
        .weight-banner span { display: block; font-size: 12px; font-weight: bold; color: var(--weight-color); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
        .weight-banner div { font-size: 28px; font-weight: 900; color: white; font-family: monospace; }

        .check-item { background: var(--bg-base); padding: 15px; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 10px; display: flex; flex-direction: column; }
        .check-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .check-law { font-weight: bold; font-size: 13px; text-transform: uppercase; color: #d1d5db; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 900; }
        
        .badge-pass { background: rgba(16, 185, 129, 0.2); color: var(--pass-color); }
        .badge-fail { background: rgba(239, 68, 68, 0.2); color: var(--fail-color); }
        .badge-warn { background: rgba(234, 179, 8, 0.2); color: var(--warn-color); }
        
        .check-detail { font-family: monospace; font-size: 12px; color: var(--text-muted); }

        /* Spec Modal */
        #spec-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); padding: 20px; align-items: center; justify-content: center; z-index: 50; }
        .modal-content { background: var(--bg-card); border: 2px solid var(--accent-blue); padding: 25px; border-radius: 16px; max-width: 500px; width: 100%; }
        .modal-title { font-size: 22px; font-weight: 900; margin: 0 0 10px 0; text-transform: uppercase; }
        .modal-desc { background: var(--bg-base); padding: 15px; border-radius: 10px; border: 1px solid var(--border-color); color: #d1d5db; line-height: 1.5; }
        .close-btn { width: 100%; padding: 15px; background: var(--bg-input); border: 1px solid var(--border-color); color: white; font-weight: bold; margin-top: 20px; border-radius: 10px; cursor: pointer; }

        /* Custom Centered Modal Keyboard */
        #keyboard-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); 
            z-index: 999; backdrop-filter: blur(4px); justify-content: center; align-items: center;
        }
        #keyboard-overlay.visible { display: flex; }
        
        #custom-keyboard {
            background: var(--bg-card); border: 2px solid var(--accent-blue);
            padding: 20px; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; width: 95%; max-width: 450px;
        }
        
        .key-btn {
            background: var(--bg-input); color: white;
            border: 1px solid var(--border-color); border-radius: 10px;
            padding: 20px 0; font-size: 26px; font-weight: 900; font-family: monospace;
            cursor: pointer; transition: background 0.1s;
        }
        .key-btn:active { background: #4b5563; }
        .key-action { color: var(--warn-color); font-size: 20px; }
        .key-done { 
            grid-column: span 4; background: var(--accent-blue); color: white; 
            border-color: var(--accent-blue); font-size: 22px; letter-spacing: 2px; padding: 15px 0; 
        }
        .key-done:active { background: var(--accent-blue-hover); }
    </style>
</head>
<body>

<div class="container">
    
    <!-- Specs Dropdown -->
    <select id="spec-select" onchange="showSpecModal()">
        <option value="" selected disabled>📖 VIEW ASTM C76 CAGE SPECS</option>
        <option value="c76_steel">ASTM C76 - Area Steel (As)</option>
        <option value="c76_cover">ASTM C76 - Clear Cover</option>
        <option value="c76_long">ASTM C76 - Longitudinal</option>
        <option value="joint_geo">Joint Geometry - Bell/Spigot</option>
    </select>

    <!-- Size Toggles -->
    <div class="btn-group" id="size-toggles">
        <!-- Generated by JS -->
    </div>

    <!-- Wall & Class Toggles -->
    <div class="split-group">
        <div class="split-container" id="wall-toggles">
            <button class="toggle-btn" onclick="selectWall('A')">Wall A</button>
            <button class="toggle-btn active" onclick="selectWall('B')">Wall B</button>
            <button class="toggle-btn" onclick="selectWall('C')">Wall C</button>
        </div>
        <!-- Locked to Class III for baseline processing -->
        <div class="split-container" id="class-toggles" style="display: none;">
            <button class="toggle-btn active" onclick="selectClass('III')">Class III</button>
        </div>
    </div>

    <!-- 3-Way Cage Target Toggle -->
    <div class="cage-target-container" id="cage-toggles">
        <button class="toggle-btn active" id="btn-single" onclick="selectCage('single')">SINGLE CAGE</button>
        <button class="toggle-btn" id="btn-inner" onclick="selectCage('inner')">INNER CAGE</button>
        <button class="toggle-btn" id="btn-outer" onclick="selectCage('outer')">OUTER CAGE</button>
    </div>

    <!-- Fractional Inputs -->
    <h2>Fractional Measurements</h2>
    <div class="bento-grid">
        <div class="input-card" id="card-wireDia" onclick="activateKeyboard('wireDia')">
            <label>Wire Dia (e.g. 3/8)</label>
            <input type="text" id="wireDia" placeholder="0.0" readonly>
        </div>
        <div class="input-card" id="card-pitch" onclick="activateKeyboard('pitch')">
            <label>Pitch (e.g. 2 1/2)</label>
            <input type="text" id="pitch" placeholder="0.0" readonly>
        </div>
        <div class="input-card" id="card-cageOD" onclick="activateKeyboard('cageOD')">
            <label>Cage OD (Inches)</label>
            <input type="text" id="cageOD" placeholder="0.0" readonly>
        </div>
        <!-- Re-added Cage Height for Weight Calculation -->
        <div class="input-card" id="card-cageLength" onclick="activateKeyboard('cageLength')">
            <label>Cage Height (Inches)</label>
            <input type="text" id="cageLength" placeholder="e.g. 96" readonly>
        </div>
        <div class="input-card" id="card-vertDia" onclick="activateKeyboard('vertDia')">
            <label>Vert Dia</label>
            <input type="text" id="vertDia" placeholder="0.0" readonly>
        </div>
        <div class="input-card" id="card-vertCount" onclick="activateKeyboard('vertCount')">
            <label>Vert Count</label>
            <input type="text" id="vertCount" placeholder="0" readonly>
        </div>
        <div class="input-card" id="card-bellOD" onclick="activateKeyboard('bellOD')">
            <label>Bell OD</label>
            <input type="text" id="bellOD" placeholder="Optional" readonly>
        </div>
    </div>

    <!-- Execute -->
    <button class="execute-btn" onclick="runArbiterValidation()">Run Arbiter Validation</button>

    <!-- Results -->
    <div id="results-container">
        <h3 id="results-title"></h3>
        <div id="results-log"></div>
    </div>

</div>

<!-- Spec Modal -->
<div id="spec-modal">
    <div class="modal-content">
        <h3 class="modal-title" id="modal-title"></h3>
        <div class="modal-desc" id="modal-desc"></div>
        <button class="close-btn" onclick="closeSpecModal()">CLOSE</button>
    </div>
</div>

<!-- Custom Centered Keyboard Overlay -->
<div id="keyboard-overlay">
    <div id="custom-keyboard">
        <button class="key-btn" onclick="handleKey('1')">1</button>
        <button class="key-btn" onclick="handleKey('2')">2</button>
        <button class="key-btn" onclick="handleKey('3')">3</button>
        <button class="key-btn key-action" onclick="handleBackspace()">⌫</button>

        <button class="key-btn" onclick="handleKey('4')">4</button>
        <button class="key-btn" onclick="handleKey('5')">5</button>
        <button class="key-btn" onclick="handleKey('6')">6</button>
        <button class="key-btn key-action" onclick="handleClear()">CLR</button>

        <button class="key-btn" onclick="handleKey('7')">7</button>
        <button class="key-btn" onclick="handleKey('8')">8</button>
        <button class="key-btn" onclick="handleKey('9')">9</button>
        <button class="key-btn key-action" style="font-size: 16px; font-weight: 900;" onclick="handleKey(' ')">SPC</button> 

        <button class="key-btn" onclick="handleKey('.')">.</button>
        <button class="key-btn" onclick="handleKey('0')">0</button>
        <button class="key-btn" onclick="handleKey('/')">/</button>
        <button class="key-btn key-done" onclick="hideKeyboard()">DONE</button>
    </div>
</div>

<script>
    // ==========================================
    // DATA CONFIGURATION
    // ==========================================
    const PIPE_SIZES = [15, 18, 24, 30, 36, 42, 48, 54, 60, 72];
    
    // Plant Specific Baseline: ASTM C76 Class III - Walls A, B, C + Internal Plant Vert Rules
    const ASTM_C76 = {
        15: { 
            A: { thk: 1.875, single: 0.07, inner: null, outer: null },
            B: { thk: 2.25, single: 0.07, inner: null, outer: null },
            C: { thk: 3.00, single: 0.07, inner: null, outer: null },
            min_vertical: 12
        },
        18: {
            A: { thk: 2.00, single: 0.07, inner: null, outer: null },
            B: { thk: 2.50, single: 0.07, inner: null, outer: null },
            C: { thk: 3.25, single: 0.07, inner: null, outer: null },
            min_vertical: 12
        },
        24: {
            A: { thk: 2.50, single: 0.17, inner: null, outer: null },
            B: { thk: 3.00, single: 0.07, inner: null, outer: null },
            C: { thk: 3.75, single: 0.07, inner: null, outer: null },
            min_vertical: 12
        },
        30: {
            A: { thk: 2.875, single: 0.19, inner: null, outer: null },
            B: { thk: 3.50, single: 0.18, inner: null, outer: null },
            C: { thk: 4.25, single: null, inner: 0.10, outer: 0.08 },
            min_vertical: 12
        },
        36: {
            A: { thk: 3.00, single: null, inner: 0.13, outer: 0.21 },
            B: { thk: 4.00, single: null, inner: 0.19, outer: 0.10 },
            C: { thk: 4.75, single: null, inner: 0.07, outer: 0.08 },
            min_vertical: 12
        },
        42: {
            A: { thk: 3.50, single: null, inner: 0.25, outer: 0.15 },
            B: { thk: 4.50, single: null, inner: 0.21, outer: 0.13 },
            C: { thk: 5.25, single: null, inner: 0.13, outer: 0.12 }, 
            min_vertical: 24
        },
        48: {
            A: { thk: 4.00, single: null, inner: 0.32, outer: 0.19 },
            B: { thk: 5.00, single: null, inner: 0.24, outer: 0.14 },
            C: { thk: 5.75, single: null, inner: 0.18, outer: 0.16 },
            min_vertical: 24
        },
        54: {
            A: { thk: 4.50, single: null, inner: 0.38, outer: 0.23 },
            B: { thk: 5.50, single: null, inner: 0.29, outer: 0.17 }, 
            C: { thk: 6.25, single: null, inner: 0.21, outer: 0.23 },
            min_vertical: 24
        },
        60: {
            A: { thk: 5.00, single: null, inner: 0.44, outer: 0.26 },
            B: { thk: 6.00, single: null, inner: 0.38, outer: 0.20 },
            C: { thk: 6.75, single: null, inner: 0.28, outer: 0.25 }, 
            min_vertical: 24
        },
        72: {
            A: { thk: 6.00, single: null, inner: 0.57, outer: 0.34 },
            B: { thk: 7.00, single: null, inner: 0.49, outer: 0.29 },
            C: { thk: 7.75, single: null, inner: 0.36, outer: 0.22 },
            min_vertical: 24
        }
    };

    const SPECS_DICT = {
        'c76_steel': { title: 'ASTM C76 - Area Steel (As)', desc: 'Governs the minimum square inches of circumferential steel per linear foot of pipe based on D-Load testing.' },
        'c76_cover': { title: 'ASTM C76 - Clear Cover', desc: 'Mandates minimum concrete cover over the steel reinforcement to prevent corrosion and spalling (Typically 1 inch for Wall B).' },
        'c76_long': { title: 'Plant Standard - Longitudinal', desc: 'Requires 12 vertical wires for 36" and under, and 24 vertical wires for 42" and up to maintain rigid forms.' },
        'joint_geo': { title: 'Joint Geometry - Bell/Spigot', desc: 'The cage must not intrude into the engineered bell or spigot joint profiles, maintaining proper gasket seating clearances.' }
    };

    // State Variables
    let selectedSize = 24;
    let selectedWall = 'B';
    let selectedClass = 'III';
    let activeCage = 'single'; 
    let activeInputId = null;

    // ==========================================
    // INITIALIZATION & UI
    // ==========================================
    function renderSizes() {
        const container = document.getElementById('size-toggles');
        container.innerHTML = '';
        PIPE_SIZES.forEach(size => {
            const btn = document.createElement('button');
            btn.className = `toggle-btn ${size === selectedSize ? 'active' : ''}`;
            btn.innerText = `${size}"`;
            btn.onclick = () => {
                selectedSize = size;
                enforceCageLogic();
                renderSizes();
            };
            container.appendChild(btn);
        });
    }

    function selectWall(wall) {
        selectedWall = wall;
        const btns = document.getElementById('wall-toggles').children;
        for(let b of btns) b.className = `toggle-btn ${b.innerText.includes(wall) ? 'active' : ''}`;
        enforceCageLogic();
    }

    function selectClass(cls) {
        selectedClass = cls;
    }

    function selectCage(cageType) {
        const reqs = ASTM_C76[selectedSize][selectedWall];
        
        if (cageType === 'single' && reqs.single === null) return;
        if ((cageType === 'inner' || cageType === 'outer') && reqs.inner === null) return;
        
        activeCage = cageType;
        updateCageToggles();
    }

    function enforceCageLogic() {
        const reqs = ASTM_C76[selectedSize][selectedWall];
        
        if (reqs.single !== null) {
            activeCage = 'single';
        } else if (reqs.single === null && reqs.inner !== null) {
            if (activeCage === 'single') activeCage = 'inner';
        }
        
        updateCageToggles();
    }

    function updateCageToggles() {
        const reqs = ASTM_C76[selectedSize][selectedWall];
        
        const btnSingle = document.getElementById('btn-single');
        const btnInner = document.getElementById('btn-inner');
        const btnOuter = document.getElementById('btn-outer');

        if (reqs.single !== null) {
            btnSingle.disabled = false;
            btnInner.disabled = true;
            btnOuter.disabled = true;
        } else {
            btnSingle.disabled = true;
            btnInner.disabled = false;
            btnOuter.disabled = false;
        }

        btnSingle.className = `toggle-btn ${activeCage === 'single' ? 'active' : ''}`;
        btnInner.className = `toggle-btn ${activeCage === 'inner' ? 'active' : ''}`;
        btnOuter.className = `toggle-btn ${activeCage === 'outer' ? 'active' : ''}`;
    }

    function showSpecModal() {
        const select = document.getElementById('spec-select');
        const val = select.value;
        if(val && SPECS_DICT[val]) {
            document.getElementById('modal-title').innerText = SPECS_DICT[val].title;
            document.getElementById('modal-desc').innerText = SPECS_DICT[val].desc;
            document.getElementById('spec-modal').style.display = 'flex';
        }
        select.value = ""; 
    }

    function closeSpecModal() {
        document.getElementById('spec-modal').style.display = 'none';
    }

    // ==========================================
    // CUSTOM CENTERED MODAL KEYBOARD
    // ==========================================
    function activateKeyboard(inputId) {
        if (activeInputId) {
            document.getElementById(`card-${activeInputId}`).classList.remove('active-card');
        }
        
        activeInputId = inputId;
        
        document.getElementById(`card-${inputId}`).classList.add('active-card');
        document.getElementById('keyboard-overlay').classList.add('visible');
    }

    function hideKeyboard() {
        if (activeInputId) {
            document.getElementById(`card-${activeInputId}`).classList.remove('active-card');
        }
        document.getElementById('keyboard-overlay').classList.remove('visible');
        activeInputId = null;
    }

    function handleKey(val) {
        if (!activeInputId) return;
        const input = document.getElementById(activeInputId);
        input.value += val;
    }

    function handleBackspace() {
        if (!activeInputId) return;
        const input = document.getElementById(activeInputId);
        input.value = input.value.slice(0, -1);
    }

    function handleClear() {
        if (!activeInputId) return;
        document.getElementById(activeInputId).value = "";
    }

    // ==========================================
    // FRACTION PARSER UTILITY
    // ==========================================
    function parseMeasurement(val) {
        if (!val) return 0;
        val = val.toString().trim();
        if (val.includes(' ')) {
            let parts = val.split(' ');
            let whole = parseFloat(parts[0]);
            let fracParts = parts[1].split('/');
            if (fracParts.length === 2) return whole + (parseFloat(fracParts[0]) / parseFloat(fracParts[1]));
            return whole;
        } else if (val.includes('/')) {
            let parts = val.split('/');
            return parseFloat(parts[0]) / parseFloat(parts[1]);
        }
        return parseFloat(val) || 0;
    }

    // ==========================================
    // ARBITER VALIDATION ENGINE
    // ==========================================
    function runArbiterValidation() {
        hideKeyboard();
        console.log(`[ARBITER] Initiating validation for ${selectedSize}" Wall ${selectedWall} Class ${selectedClass} | Target: ${activeCage.toUpperCase()} CAGE`);
        
        const d_wire = parseMeasurement(document.getElementById('wireDia').value);
        const s_pitch = parseMeasurement(document.getElementById('pitch').value);
        const l_cage = parseMeasurement(document.getElementById('cageLength').value);
        const d_vert = parseMeasurement(document.getElementById('vertDia').value);
        const count_vert = parseMeasurement(document.getElementById('vertCount').value);
        const od_cage = parseMeasurement(document.getElementById('cageOD').value);
        const od_bell = parseMeasurement(document.getElementById('bellOD').value);
        
        const resultsContainer = document.getElementById('results-container');
        const resultsTitle = document.getElementById('results-title');
        const resultsLog = document.getElementById('results-log');
        
        resultsLog.innerHTML = '';
        resultsContainer.style.display = 'block';

        if (d_wire <= 0 || s_pitch <= 0 || od_cage <= 0 || l_cage <= 0) {
            resultsContainer.style.backgroundColor = 'rgba(239, 68, 68, 0.1)';
            resultsContainer.style.borderColor = '#7f1d1d';
            resultsTitle.style.color = 'var(--fail-color)';
            resultsTitle.innerText = 'Execution Error';
            resultsLog.innerHTML = '<div style="color:var(--fail-color); font-family:monospace; text-align:center;">Critical measurements (including Cage Height) missing. Arbiter cannot execute.</div>';
            return;
        }

        const standard = ASTM_C76[selectedSize][selectedWall];
        const min_vertical = ASTM_C76[selectedSize].min_vertical;

        if (!standard) {
            resultsLog.innerHTML = '<div style="color:var(--fail-color);">Size parameters outside Arbiter database.</div>';
            return;
        }

        let passedAll = true;
        let checksHTML = '';

        const addCheck = (law, status, detail) => {
            let badgeClass = status === 'PASS' ? 'badge-pass' : status === 'FAIL' ? 'badge-fail' : 'badge-warn';
            checksHTML += `
                <div class="check-item">
                    <div class="check-header">
                        <span class="check-law">${law}</span>
                        <span class="badge ${badgeClass}">${status}</span>
                    </div>
                    <span class="check-detail">${detail}</span>
                </div>
            `;
        };

        // --- CAGE WEIGHT CALCULATOR (Volumetric Density of Steel = 0.2833 lbs/in³) ---
        const steelDensity = 0.2833; 
        
        // 1. Circumferential Wire Weight
        const circWireArea = Math.PI * Math.pow(d_wire / 2, 2);
        const cageCircumference = Math.PI * od_cage; // linear inches per wrap
        const numberOfWraps = l_cage / s_pitch;
        const totalCircLength = cageCircumference * numberOfWraps; // total linear inches
        const circWeight = totalCircLength * circWireArea * steelDensity;

        // 2. Vertical Wire Weight
        const vertWireArea = Math.PI * Math.pow(d_vert / 2, 2);
        const totalVertLength = l_cage * count_vert; // total linear inches
        const vertWeight = totalVertLength * vertWireArea * steelDensity;

        // 3. Total
        const totalEstimatedWeight = circWeight + vertWeight;

        checksHTML += `
            <div class="weight-banner">
                <span>Estimated Cage Weight</span>
                <div>${totalEstimatedWeight.toFixed(1)} LBS</div>
            </div>
        `;

        // LAW 1: Area of Steel
        const areaSingle = (Math.PI * Math.pow(d_wire, 2)) / 4;
        const actual_As = areaSingle * (12 / s_pitch);
        
        const target_As = standard[activeCage];
        if (!target_As) {
            resultsLog.innerHTML = `<div style="color:var(--fail-color);">Arbiter Error: ${activeCage.toUpperCase()} cage requirement not defined for ${selectedSize}" Wall ${selectedWall} pipe.</div>`;
            return;
        }

        const asPassed = actual_As >= target_As;
        if (!asPassed) passedAll = false;
        addCheck(`${activeCage} Cage Area Steel (As)`, asPassed ? 'PASS' : 'FAIL', `Calculated ${actual_As.toFixed(4)} sq.in/ft. Required: ${target_As.toFixed(4)}.`);

        // LAW 2: Clear Cover
        const pipe_OD = selectedSize + (standard.thk * 2);
        let clear_cover = 0;
        let cover_location = "";

        if (activeCage === 'outer' || activeCage === 'single') {
            clear_cover = (pipe_OD - od_cage) / 2;
            cover_location = "from outside wall";
        } else if (activeCage === 'inner') {
            const id_cage = od_cage - (2 * d_wire);
            clear_cover = (id_cage - selectedSize) / 2;
            cover_location = "from inside wall";
        }

        const coverPassed = clear_cover >= 0.75 && clear_cover <= 1.5;
        if (!coverPassed) passedAll = false;
        addCheck(`Structural Clear Cover`, coverPassed ? 'PASS' : 'FAIL', `Calculated cover: ${clear_cover.toFixed(3)}" ${cover_location}. Optimal is ~1.00".`);

        // LAW 3: Plant Specific Longitudinal count
        const vertPassed = count_vert >= min_vertical;
        if (!vertPassed) passedAll = false;
        addCheck("Plant Standard Vertical Wires", vertPassed ? 'PASS' : 'FAIL', `Count: ${count_vert}. Plant minimum required: ${min_vertical}.`);

        // LAW 4: Bell Geometry
        if (od_bell > 0) {
            const bellClearance = od_bell - od_cage;
            const bellPassed = bellClearance > 1.5; 
            if (!bellPassed) passedAll = false;
            addCheck("Bell Flare Geometry", bellPassed ? 'PASS' : 'FAIL', `Flare extension: ${bellClearance.toFixed(2)}". Must maintain cover in bell seating.`);
        } else {
            addCheck("Bell Flare Geometry", 'WARN', `No bell OD entered. Bypassing joint specification.`);
        }

        // Output Result UI
        if (passedAll) {
            resultsContainer.style.backgroundColor = 'rgba(16, 185, 129, 0.1)';
            resultsContainer.style.borderColor = '#064e3b';
            resultsTitle.style.color = 'var(--pass-color)';
            resultsTitle.innerText = `${activeCage.toUpperCase()} Cage Approved`;
        } else {
            resultsContainer.style.backgroundColor = 'rgba(239, 68, 68, 0.1)';
            resultsContainer.style.borderColor = '#7f1d1d';
            resultsTitle.style.color = 'var(--fail-color)';
            resultsTitle.innerText = `${activeCage.toUpperCase()} Cage Failed`;
        }
        
        resultsLog.innerHTML = checksHTML;
        console.log(`[ARBITER] Execution complete. Status: ${passedAll ? 'PASSED' : 'FAILED'}`);
    }

    // Boot up
    renderSizes();
    enforceCageLogic();
</script>
</body>
</html>
